x-mgwatch-runtime: &mgwatch-runtime
  user: "${MGWATCH_UID:-1000}:${MGWATCH_GID:-1000}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m
x-container-runtime: &container-runtime
  security_opt:
    - no-new-privileges:true
services:
  mgwatch:
    !!merge <<: *mgwatch-runtime
    image: ${DOCKER_MGWATCH_IMAGE:?set DOCKER_MGWATCH_IMAGE in .env}
    container_name: mgwatch
    env_file:
      - ./vars.env
    volumes:
      - ./vars.env:/code/vars.env:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ${EXTERNAL_DATA_DIR}/backend-data:/data
      - ${SQLITE_DIR}:/data-db
      - ${LOG_DIR}:/logs
      - ${NGINX_DATA_DIR}/static:/code/static
    environment:
      - TZ=${TZ}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    entrypoint: /bin/sh -c
    command:
      - pixi run --frozen ./manage.py collectstatic --no-input && pixi run --frozen gunicorn --workers 2 --threads 2 --bind 0.0.0.0:8100 mgw.wsgi:application
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pixi run --frozen python -c \"import os, urllib.request; host=(os.environ.get('ALLOWED_HOSTS') or 'localhost').split(',')[0].strip(); req=urllib.request.Request('http://127.0.0.1:8100/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=5).close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mgwatch-mongodb:
        condition: service_healthy
      mgwatch-redis:
        condition: service_healthy
  mgwatch-celery-interactive:
    !!merge <<: *mgwatch-runtime
    image: ${DOCKER_MGWATCH_IMAGE:?set DOCKER_MGWATCH_IMAGE in .env}
    container_name: mgwatch-celery-interactive
    env_file:
      - ./vars.env
    volumes:
      - ./vars.env:/code/vars.env:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ${EXTERNAL_DATA_DIR}/backend-data:/data
      - ${SQLITE_DIR}:/data-db
      - ${LOG_DIR}:/logs
    environment:
      - TZ=${TZ}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    entrypoint: /bin/sh -c
    command:
      - pixi run --frozen celery -A mgw worker --queues interactive --concurrency 2 --hostname interactive@%h
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[c]elery.*worker.*interactive' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mgwatch:
        condition: service_healthy
  mgwatch-celery-maintenance:
    !!merge <<: *mgwatch-runtime
    image: ${DOCKER_MGWATCH_IMAGE:?set DOCKER_MGWATCH_IMAGE in .env}
    container_name: mgwatch-celery-maintenance
    env_file:
      - ./vars.env
    volumes:
      - ./vars.env:/code/vars.env:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ${EXTERNAL_DATA_DIR}/backend-data:/data
      - ${SQLITE_DIR}:/data-db
      - ${LOG_DIR}:/logs
    environment:
      - TZ=${TZ}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    entrypoint: /bin/sh -c
    command:
      - pixi run --frozen celery -A mgw worker --queues maintenance,indexing,watches --concurrency 1 --hostname maintenance@%h
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[c]elery.*worker.*maintenance' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mgwatch:
        condition: service_healthy
  mgwatch-celery-beat:
    !!merge <<: *mgwatch-runtime
    image: ${DOCKER_MGWATCH_IMAGE:?set DOCKER_MGWATCH_IMAGE in .env}
    container_name: mgwatch-celery-beat
    env_file:
      - ./vars.env
    volumes:
      - ./vars.env:/code/vars.env:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ${EXTERNAL_DATA_DIR}/backend-data:/data
      - ${SQLITE_DIR}:/data-db
      - ${LOG_DIR}:/logs
    environment:
      - TZ=${TZ}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    entrypoint: /bin/sh -c
    command:
      - pixi run --frozen celery -A mgw beat --loglevel INFO --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[c]elery.*beat' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mgwatch:
        condition: service_healthy
  mgwatch-mongodb:
    !!merge <<: *container-runtime
    image: ${DOCKER_MONGODB_IMAGE:?set DOCKER_MONGODB_IMAGE in .env}
    container_name: mgwatch-mongodb
    environment:
      - TZ=${TZ}
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MGWATCH_MONGO_ROOT_PASSWORD:?set MGWATCH_MONGO_ROOT_PASSWORD in .env}
    volumes:
      - ${MONGODB_DATA_DIR}:/data/db
      - ${MONGODB_LOG_DIR}:/data/logs
    command: --logpath /data/logs/mongodb.log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' --username root --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  mgwatch-redis:
    !!merge <<: *container-runtime
    image: ${DOCKER_REDIS_IMAGE:?set DOCKER_REDIS_IMAGE in .env}
    container_name: mgwatch-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  mgwatch-proxy:
    !!merge <<: *container-runtime
    image: ${DOCKER_NGINX_IMAGE:?set DOCKER_NGINX_IMAGE in .env}
    container_name: mgwatch-proxy
    volumes:
      - ./nginx-templates:/etc/nginx/templates:ro
      - ${NGINX_DATA_DIR}/static:/static:ro
    environment:
      - TZ=${TZ}
      - NGINX_PORT=8000
      - NGINX_LOGIN_RATE_LIMIT=${NGINX_LOGIN_RATE_LIMIT:-10r/m}
      - NGINX_LOGIN_RATE_BURST=${NGINX_LOGIN_RATE_BURST:-5}
    ports:
      - ${PUBLIC_BIND_ADDRESS}:${PUBLIC_HTTP_PORT}:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && test -s /var/run/nginx.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      mgwatch:
        condition: service_healthy
