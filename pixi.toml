[workspace]
name = "mgwatch"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.76.2"

[dependencies]
python = ">=3.13,<3.14"
django = ">=6.1,<7"
django-debug-toolbar = ">=7.1,<8"
django-environ = ">=0.11,<1"
pillow = ">=10.4,<13"
pandas = ">=3,<4"
pymongo = ">=4.8,<5"
pyarrow = ">=25,<26"
numpy = ">=2.1,<3"
pyyaml = ">=6,<7"
python-crontab = ">=3.2,<4"
sourmash-minimal = ">=4.9,<5"
sourmash_plugin_branchwater = ">=0.9.14,<0.10"
aiosmtpd = ">=1.4,<2"
gunicorn = ">=26,<27"
python-ldap = ">=3.4,<4"
curl = ">=8.11,<9"
polars = ">=1.22,<2"
httpx = ">=0.28,<0.29"
httpx-retries = ">=0.6,<0.7"
aiofiles = ">=25.1,<26"
aiohttp = ">=3.11,<4"
rich = ">=14,<15"
whitenoise = ">=6.12,<7"
celery = ">=5.5,<6"
redis-py = ">=8.1,<9"
coverage = ">=7.6,<8"
aiobotocore = ">=3.9.0,<4"
urllib3 = ">=2.7,<3"

[pypi-dependencies]
django-auth-ldap = ">=5,<6"
django-axes = { version = ">=8.3,<9", extras = ["ipware"] }
django-redis = ">=7,<8"

[feature.security.dependencies]
trivy = ">=0.74,<1"

[feature.security.tasks]
trivy-fs = "trivy fs --scanners vuln --severity HIGH,CRITICAL ."
trivy-image = "trivy image --scanners vuln --severity HIGH,CRITICAL mgwatch:local"

[environments]
security = { features = ["security"], no-default-feature = true }

[tasks]
manage = "./manage.py"
