version: 2
updates:
  # Renovate manages Docker images and application dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-security:
        applies-to: security-updates
        patterns:
          - "*"
      all-versions:
        applies-to: version-updates
        patterns:
          - "*"
